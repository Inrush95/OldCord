name: Compile 32-bit Abaddon
on: [workflow_dispatch]

jobs:
  build-x86:
    runs-on: windows-2022
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          repository: uowuo/abaddon
          ref: 'v0.2.2'
          submodules: 'recursive'

      - name: Setup MSYS2 Environment
        uses: msys2/setup-msys2@v2.22.0
        with:
          msystem: CLANG32
          update: false  # Bypasses the broken upgrade step causing the crash
          path-type: minimal

      - name: Install 32-bit Core Dependencies
        shell: msys2 {0}
        run: |
          pacman -Sy --noconfirm --needed \
            git \
            mingw-w64-clang-i686-toolchain \
            mingw-w64-clang-i686-cmake \
            mingw-w64-clang-i686-ninja \
            mingw-w64-clang-i686-gtkmm3 \
            mingw-w64-clang-i686-libhandy \
            mingw-w64-clang-i686-libsodium \
            mingw-w64-clang-i686-nlohmann-json \
            mingw-w64-clang-i686-spdlog

      - name: Compile Application
        shell: msys2 {0}
        run: |
          mkdir build && cd build
          cmake .. -G "Ninja" -DCMAKE_BUILD_TYPE=MinSizeRel -DBUILD_TESTING=OFF -DENABLE_DOCS=OFF
          ninja

      - name: Upload Finished Program
        uses: actions/upload-artifact@v4
        with:
          name: abaddon-windows-32bit
          path: build/abaddon.exe
