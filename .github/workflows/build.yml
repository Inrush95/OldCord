name: Compile 32-bit Abaddon
on: [workflow_dispatch]

jobs:
  build-x86:
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Windows MSVC Build Environment
        uses: microsoft/setup-msbuild@v2

      - name: Setup Direct Source Dependencies
        shell: cmd
        run: |
          git clone --depth 1 https://github.com subprojects/json
          git clone --depth 1 https://github.com subprojects/libhandy

      - name: Compile 32-bit Desktop Binary
        shell: cmd
        run: |
          mkdir build
          cd build
          cmake -A Win32 -DCMAKE_BUILD_TYPE=Release ..
          cmake --build . --config Release

      - name: Upload Completed 32-bit Executable
        uses: actions/upload-artifact@v4
        with:
          name: abaddon-windows-32bit
          path: build/Release/abaddon.exe
          
