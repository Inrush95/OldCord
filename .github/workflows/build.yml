name: Compile 32-bit Abaddon
on: [workflow_dispatch]

jobs:
  build-x86:
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSYS2 and Update Mirrors
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          install: >-
            mingw-w64-i686-toolchain
            mingw-w64-i686-cmake
            mingw-w64-i686-nlohmann-json
            mingw-w64-i686-opus
            mingw-w64-i686-spdlog

      - name: Install Hard-to-Find 32-bit Dependencies
        shell: msys2 {0}
        run: |
          # Force pacman to refresh database keys to bypass 404 mirror locks
          pacman -Sy --noconfirm
          pacman -S --needed --noconfirm mingw-w64-i686-gtkmm3 mingw-w64-i686-libsodium

      - name: Compile Abaddon
        shell: msys2 {0}
        run: |
          mkdir build && cd build
          cmake -G "MSYS Makefiles" -DCMAKE_BUILD_TYPE=Release ..
          make -j2

      - name: Upload Completed 32-bit Executable
        uses: actions/upload-artifact@v4
        with:
          name: abaddon-windows-32bit
          path: build/abaddon.exe
          
