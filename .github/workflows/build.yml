name: Compile 32-bit Abaddon
on: [workflow_dispatch]

jobs:
  build-x86:
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Fast MSYS2 Environment
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: false

      - name: Install Slim Build Tools Only
        shell: msys2 {0}
        run: |
          # Initialize database indexes
          pacman-key --init
          pacman-key --populate msys2
          pacman -Sy --noconfirm
          
          # Install only the absolute bare essential compiler binaries to avoid timeouts
          pacman -S --needed --noconfirm mingw-w64-i686-gcc mingw-w64-i686-make mingw-w64-i686-cmake mingw-w64-i686-pkgconf
          
          # Install core library binaries
          pacman -S --needed --noconfirm mingw-w64-i686-json mingw-w64-i686-gtkmm3 mingw-w64-i686-libsodium mingw-w64-i686-opus mingw-w64-i686-spdlog

      - name: Build Application
        shell: msys2 {0}
        run: |
          mkdir build && cd build
          cmake -G "MSYS Makefiles" -DCMAKE_BUILD_TYPE=Release ..
          make -j2

      - name: Upload Completed 32-bit Executable
        uses: actions/upload-artifact@v4
        with:
          name: abaddon-windows-32bit
          path: build/abaddon.exe
          
