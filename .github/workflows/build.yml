name: Compile 32-bit Abaddon
on: [workflow_dispatch]

jobs:
  build-x86:
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code and All Dependencies
        uses: actions/checkout@v4
        with:
          submodules: recursive
          set-safe-directory: true

      - name: Setup Windows MSVC Build Environment
        uses: microsoft/setup-msbuild@v2

      - name: Locate Source and Compile 32-bit Binary
        shell: cmd
        run: |
          # 1. Look for the folder that actually contains CMakeLists.txt
          dir /s /b CMakeLists.txt > folder_path.txt
          set /p SOURCE_PATH=<folder_path.txt
          
          # 2. Extract the directory name from the full file path
          for %%F in ("%SOURCE_PATH%") do set "SOURCE_DIR=%%~dpF"
          echo Target source directory is: %SOURCE_DIR%
          
          # 3. Create the build directory and point CMake right at the valid folder
          mkdir build
          cd build
          cmake -A Win32 -DCMAKE_BUILD_TYPE=Release "%SOURCE_DIR%"
          cmake --build . --config Release

      - name: Upload Completed 32-bit Executable
        uses: actions/upload-artifact@v4
        with:
          name: abaddon-windows-32bit
          path: build/Release/abaddon.exe
          
